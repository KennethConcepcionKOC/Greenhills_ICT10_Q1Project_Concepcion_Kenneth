<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Project</title>
    
    <style>
        body {
            background-image: url(https://images.pexels.com/photos/36580122/pexels-photo-36580122.jpeg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        nav {
            background-color: #333;
            padding: 12px 30px;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .box {
            background-color: white;
            width: 380px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        #output {
            text-align: center;
            margin-top: 18px;
            font-size: 1.1rem;
            color: #333;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">SKU Generator</a>
        <a href="receipt.html">Receipt Generator</a>
    </nav>

    <div class="box">
        <!-- boxes to fill out -->
        <h2>SKU Generator</h2>

        <label>Product Category</label>
        <input type="text" id="type" placeholder="ex. BKP">


        <label>Product Name</label>
        <input type="text" id="name" placeholder="ex. Crepe">


        <label>Stock Quantity</label>
        <input type="number" id="amount" placeholder="ex. 10">


        <button py-click="generate_sku">Generate SKU</button>

        <p id="output"></p>
    </div>

    <script type="py" src="sku.py"></script>

    <footer>
        <p>SKU Generator -- 1st QTR</p>
    </footer>

</body>
</html>
